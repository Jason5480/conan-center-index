patches:
  "6.12.0":
    - "patch_file": "patches/qtbase-endentrylist-out-of-line.patch"
      "patch_description": "Define QAbstractFileEngine::endEntryList() out of line: with C++23, MSVC instantiates the destructor of std::unique_ptr<QAbstractFileEngineIterator> in the inline body, where the iterator is only forward declared"
      "patch_type": "backport"
      "patch_source": "https://code.qt.io/cgit/qt/qtbase.git/commit/?h=6.12&id=852e93e9ee56b61eac58ca35605b790480d201e1"
      "base_path": "qtbase"
    - "patch_file": "patches/qtdeclarative-qjsengineprivate-ctor-out-of-line.patch"
      "patch_description": "Define the QJSEnginePrivate constructor out of line: with C++23, MSVC instantiates the destructor of its std::unique_ptr<QV4::ExecutionEngine> member in the inline defaulted constructor, where the engine is only forward declared"
      "patch_type": "portability"
      "patch_source": "https://qt-project.atlassian.net/browse/QTBUG-152533"
      "base_path": "qtdeclarative"
    - "patch_file": "patches/qffmpeg-ranges-to-explicit-container.patch"
      "patch_description": "Name the container type in ranges::to<QMinimalFlatSet<AVPixelFormat>>(), which neither MSVC nor libc++ 17 can deduce with C++23, and drop the disabled debug output that needs the same deduction"
      "patch_type": "backport"
      "patch_source": "https://code.qt.io/cgit/qt/qtmultimedia.git/commit/?h=6.12&id=80f19ec344"
      "base_path": "qtmultimedia"
  "6.11.3":
    - "patch_file": "patches/qtbase-endentrylist-out-of-line.patch"
      "patch_description": "Define QAbstractFileEngine::endEntryList() out of line: with C++23, MSVC instantiates the destructor of std::unique_ptr<QAbstractFileEngineIterator> in the inline body, where the iterator is only forward declared"
      "patch_type": "backport"
      "patch_source": "https://code.qt.io/cgit/qt/qtbase.git/commit/?h=6.12&id=852e93e9ee56b61eac58ca35605b790480d201e1"
      "base_path": "qtbase"
    - "patch_file": "patches/qtdeclarative-qjsengineprivate-ctor-out-of-line.patch"
      "patch_description": "Define the QJSEnginePrivate constructor out of line: with C++23, MSVC instantiates the destructor of its std::unique_ptr<QV4::ExecutionEngine> member in the inline defaulted constructor, where the engine is only forward declared"
      "patch_type": "portability"
      "patch_source": "https://qt-project.atlassian.net/browse/QTBUG-152533"
      "base_path": "qtdeclarative"
  "6.8.3":
    - "patch_file": "patches/remove-linkage-to-agl-framework.patch"
      "base_path": "qtbase"
    - "patch_file": "patches/macos-link-platform-plugin-to-foundation.patch"
      "base_path": "qtbase"
    - "patch_file": "patches/c72097e_6.8.3.diff"
      "base_path": "qtwebengine"
    - "patch_file": "patches/fix_webengine_on_VS2022_v17.14_6.8.x.diff"
      "base_path": "qtwebengine/src/3rdparty"
    - "patch_file": "patches/6.8.3-fix-macos-26.4.diff"
      "base_path": "qtbase"
    - "patch_file": "patches/qtbase-endentrylist-out-of-line.patch"
      "patch_description": "Define QAbstractFileEngine::endEntryList() out of line: with C++23, MSVC instantiates the destructor of std::unique_ptr<QAbstractFileEngineIterator> in the inline body, where the iterator is only forward declared"
      "patch_type": "backport"
      "patch_source": "https://code.qt.io/cgit/qt/qtbase.git/commit/?h=6.12&id=852e93e9ee56b61eac58ca35605b790480d201e1"
      "base_path": "qtbase"
